  servo: {description: configure servos, gate: USE_SERVOS}
  set: {description: change setting, args: '[<name>=<value>]'}
  signature: {description: get / set the board type signature, args: '[signature]', gate: USE_SIGNATURE}
  smix: {description: servo mixer, args: "<rule> <servo> <source> <rate> <speed> <min> <max> <box>\nreset\nload <mixer>\nreverse <servo> <source> r|n", gate: USE_SERVOS}
  status: {description: show status}
  tasks: {description: show task stats, gate: USE_TASK_STATISTICS}
  timer: {description: show/set timers, args: '<> | <pin> list | <pin> [af<alternate function>|none|<option(deprecated)>] | list | show', gate: USE_TIMER_MGMT}
  version: {description: show version}
