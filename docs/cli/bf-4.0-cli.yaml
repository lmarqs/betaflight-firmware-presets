  vtx_channel: {type: uint8, min: 1, max: 8, default: 1, gate: USE_VTX_COMMON}
  vtx_freq: {type: uint16, min: 0, max: 5999, default: 5740, description: "if vtx_band!=0 and VTX connected then shows freq in MHz\nif vtx_band==0 then sets frequency in MHz\nif vtx_band==0 and vtx_freq==0 then the settings will not be sent out to the VTX\nFor example, to configure the VTX to use band 'F' and channel '6' (5840 MHz), enter the CLI and input:\nset vtx_band = 4\nset vtx_channel = 6\nsave\nThe VTX configuration will not be changed until after the 'save' and restart. If it is successful then entering 'get vtx_freq' will show the current frequency value in MHz.\nFrequency table:\nChannel\n1 2 3 4 5 6 7 8\nBand 1: 5865 5845 5825 5805 5785 5765 5745 5725 (A: Boscam A / TBS / RC305)\nBand 2: 5733 5752 5771 5790 5809 5828 5847 5866 (B: Boscam B)\nBand 3: 5705 5685 5665 5645 5885 5905 5925 5945 (E: Boscam E / DJI)\nBand 4: 5740 5760 5780 5800 5820 5840 5860 5880 (F: IRC NexWave / Fatshark)\nBand 5: 5658 5695 5732 5769 5806 5843 5880 5917 (R: Raceband)", gate: USE_VTX_COMMON && VTX_SETTINGS_FREQCMD}
  vtx_halfduplex: {type: enum, values: ['OFF', 'ON'], default: 'ON', gate: USE_VTX_CONTROL && USE_VTX_COMMON}
  vtx_low_power_disarm: {type: enum, values: ['OFF', 'ON', UNTIL_FIRST_ARM], default: 'OFF', description: 'If ON and the flight controller is disarmed, the video transmitter output power will be set to its lowest value (vtx_power=1). Otherwise, the video transmitter output power will be set to the configured ''vtx_power'' value. (Note one exception: If a receiver failsafe has occurred then the output power will not be lowered.)', gate: USE_VTX_COMMON}
  vtx_pit_mode_freq: {type: uint16, min: 0, max: 5999, default: 0, gate: USE_VTX_COMMON && VTX_SETTINGS_FREQCMD}
  vtx_power: {type: uint8, min: VTX_SETTINGS_MIN_POWER, max: VTX_SETTINGS_POWER_COUNT-1, default: 1, description: "for SmartAudio: 0=25mW, 1=25mW, 2=200mW, 3=500mW, 4=800mW\nfor TBS Unify Nano: 0=25mW, 1=25mW, 2=50mW\nfor IRC-Tramp: 0=25mW, 1=25mW, 2=100mW, 3=200mW, 4=400mW, 5=600mW", gate: USE_VTX_COMMON}
  yaw_control_reversed: {type: enum, values: ['OFF', 'ON'], default: 'OFF'}
  yaw_deadband: {type: uint8, min: 0, max: 100, default: 0}
  yaw_expo: {scope: rateprofile, type: uint8, min: 0, max: 100}
  yaw_lowpass_hz: {scope: profile, type: uint16, min: 0, max: 500, default: 0}
  yaw_motors_reversed: {type: enum, values: ['OFF', 'ON'], default: 'OFF'}
  yaw_rate_limit: {scope: rateprofile, type: uint16, min: 200, max: 1998, default: 1998}
  yaw_rc_rate: {scope: rateprofile, type: uint8, min: 1, max: 255}
  yaw_spin_recovery: {type: enum, values: ['OFF', 'ON'], default: 'ON', description: "This new feature, enabled by default in betaflight 3.4, reduces the severity and duration of un-commanded severe yaw spins.\nFor example, if a quadcopter clips a gate, tree, branch or other object and causes a high rate yaw spin, it may go into a 'never-ending' uncontrollable spin.\nTypically it makes a distinctive warbling noise and climbs rapidly - the so-called Yaw Spin To The Moon (YSTTM) problem. 3.4 introduces two code features that should bring such spins under control more quickly and cleanly.\nYaw Spin Recovery is intended primarily for FPV pilots, and works best with MPU gyros.\nLOS acro pilots who use high yaw rates may prefer to disable this function.", gate: USE_YAW_SPIN_RECOVERY}
  yaw_spin_threshold: {type: uint16, min: 500, max: 1950, default: 1950, description: "The 'threshold' value is the spin rate, in degrees per second, at which the spin protection kicks in.\nThe default threshold of 1950 was chosen to minimise false triggering. For FPV, a lower value, e.g. 100-200 above your maximum configured yaw rate, is recommended.\nFor example, a quad with a maximum configured yaw rate of 700 degrees/sec:\nToo low a threshold may cause false triggering, and delay return to normal control.", gate: USE_YAW_SPIN_RECOVERY}
  yaw_srate: {scope: rateprofile, type: uint8, min: 0, max: 255}
