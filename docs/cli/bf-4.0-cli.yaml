  commit: 2a64051
  date: '2019-09-01'
wiki: https://betaflight.com/docs/wiki/guides/archive/Betaflight-4.0-CLI-commands
notes:
- Legacy version, kept for compatibility checks of old presets; not a target for new presets.
- '`default` is the value printed on the wiki page, which was dumped from one flight controller; hardware-related defaults (buses, sensors, motor protocol, battery meter) are board-specific.'
- 'The wiki page documents an earlier 4.0 build than 4.0-maintenance: it lists align_gyro, align_acc, gyro_use_32khz, gyro_32khz_hardware_lpf, x_min_usec and dterm_cut_*, which this branch does not have, and shows other ranges for some keys (e.g. gyro/dterm filter cutoffs 0 - 16000; source: 0 - 4000). `default` and `description` come from that page.'
modes: {}
osd_warnings: {0: ARMING_DISABLE, 1: BATTERY_NOT_FULL, 2: BATTERY_WARNING, 3: BATTERY_CRITICAL, 4: VISUAL_BEEPER, 5: CRASH_FLIP, 6: ESC_FAIL, 7: CORE_TEMPERATURE, 8: RC_SMOOTHING, 9: FAIL_SAFE, 10: LAUNCH_CONTROL, 11: GPS_RESCUE_UNAVAILABLE, 12: GPS_RESCUE_DISABLED}
osd_stats: {0: RTC_DATE_TIME, 1: TIMER_1, 2: TIMER_2, 3: MAX_SPEED, 4: MAX_DISTANCE, 5: MIN_BATTERY, 6: END_BATTERY, 7: BATTERY, 8: MIN_RSSI, 9: MAX_CURRENT, 10: USED_MAH, 11: MAX_ALTITUDE, 12: BLACKBOX, 13: BLACKBOX_NUMBER, 14: MAX_G_FORCE, 15: MAX_ESC_TEMP, 16: MAX_ESC_RPM, 17: MIN_LINK_QUALITY, 18: FLIGHT_DISTANCE, 19: MAX_FFT}
constants:
  ADCDEV_COUNT: target-dependent
  I2CDEV_COUNT: target-dependent
  OSD_POSCFG_MAX: = (OSD_PROFILE_MASK | 0x3FF)
  OSD_PROFILE_COUNT: target-dependent
  OSD_PROFILE_MASK: = (((1 << OSD_PROFILE_COUNT) - 1) << OSD_PROFILE_BITS_POS)
  PINIO_COUNT: [{value: 4, gate: default}]
  SPIDEV_COUNT: target-dependent
  VTX_SETTINGS_MIN_POWER: [{value: VTX_RTC6705_MIN_POWER, gate: '!(USE_VTX_SMARTAUDIO || USE_VTX_TRAMP) && USE_VTX_RTC6705'}, {value: 0, gate: USE_VTX_SMARTAUDIO || USE_VTX_TRAMP}]
  VTX_SETTINGS_POWER_COUNT: [{value: VTX_RTC6705_POWER_COUNT, gate: '!(USE_VTX_SMARTAUDIO || USE_VTX_TRAMP) && USE_VTX_RTC6705'}, {value: 5, gate: USE_VTX_SMARTAUDIO || USE_VTX_TRAMP}]
commands:
  adjrange: {description: configure adjustment ranges}
