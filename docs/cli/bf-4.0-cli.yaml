  name: {description: name of craft}
  play_sound: {args: '[<index>]', gate: '!MINIMAL_CLI'}
  profile: {description: change profile, args: '[<index>]'}
  rateprofile: {description: change rate profile, args: '[<index>]'}
  rc_smoothing_info: {description: show rc_smoothing operational settings, gate: USE_RC_SMOOTHING_FILTER}
  resource: {description: show/set resources, args: '<> | <resource name> <index> [<pin>|none] | show [all]', gate: USE_RESOURCE_MGMT}
  rxfail: {description: show/set rx failsafe settings}
  rxrange: {description: configure rx channel ranges}
